name: Hybrid Codespace-Rendered Desktop

on:
  workflow_dispatch:

jobs:
  hybrid-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 1. Spawn Codespace (The Backend Rendering Engine)
        run: |
          echo "Spinning up remote Codespace for heavy rendering..."
          
          # Create the codespace cleanly without flag crashes
          gh codespace create --repo ${{ github.repository }} --yes
          
          # Safely query the exact name of the newly created codespace
          CODESPACE_NAME=$(gh codespace list --limit 1 --json name -q ".[0].name")

          echo "CODESPACE_NAME=$CODESPACE_NAME" >> $GITHUB_ENV
          echo "Successfully bound to Codespace: $CODESPACE_NAME"
          
          echo "Waiting for Codespace to boot up..."
          gh codespace cp -c "$CODESPACE_NAME" -r . /workspaces/repo || true
      - name: 2. Start noVNC Desktop inside the Codespace
        run: |
          # Command the Codespace to pull and run your desktop container in the background
          gh codespace ssh -c "${{ env.CODESPACE_NAME }}" -- \
            "docker run -d --rm --name desktop -p 8080:8080 -e 'TZ=America/Los_Angeles' prbinu/novnc-desktop"

      - name: 3. Establish Port Forwarding from Codespace to Actions Runner
        run: |
          # Background port forward: maps Codespace port 8080 to localhost:8080 on the Actions runner
          gh codespace ports forward 8080:8080 -c "${{ env.CODESPACE_NAME }}" &
          
          # Give the port forward a moment to bind
          sleep 5

      - name: 4. Start Cloudflare Tunnel (The Public Frontend Gateway)
        run: |
          # Install cloudflared on the Actions runner
          curl -L --output cloudflared-linux-amd64.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb

          echo "===================================================="
          echo "LAUNCHING PUBLIC GATEWAY URL..."
          echo "===================================================="
          
          # Tunnel the local port (which is securely piped from the Codespace backend)
          cloudflared tunnel --url http://localhost:8080 --no-autoupdate
