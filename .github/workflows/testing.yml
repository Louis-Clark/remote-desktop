name: Codespace noVNC Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read

    env:
      GH_CODESPACE_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
      CODESPACE_NAME: desktop-${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Authenticate GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_CODESPACE_TOKEN:-}" ]; then
            echo "GH_CODESPACE_TOKEN is not set"
            exit 1
          fi

          unset GH_TOKEN
          echo "${GH_CODESPACE_TOKEN}" | gh auth login --with-token

      - name: Reuse or create Codespace
        shell: bash
        run: |
          set -euo pipefail

          existing=$(gh codespace list --json name,state --jq '.[] | select(.state=="Available") | .name' | head -n 1 || true)

          if [ -n "${existing}" ]; then
            echo "Using existing codespace: ${existing}"
            echo "CODESPACE_NAME=${existing}" >> "$GITHUB_ENV"
          else
            echo "Creating a new codespace for this repo..."
            gh codespace create \
              --repo "${{ github.repository }}" \
              --display-name "${CODESPACE_NAME}" \
              --machine basicLinux32gb \
              --default-permissions \
              --json name,state \
              --jq '.name' > /tmp/codespace_name.txt

            if [ ! -s /tmp/codespace_name.txt ]; then
              echo "Codespace creation returned no name"
              gh codespace list --json name,state || true
              exit 1
            fi

            echo "CODESPACE_NAME=$(cat /tmp/codespace_name.txt)" >> "$GITHUB_ENV"
          fi

      - name: Wait for Codespace to be ready
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            state=$(gh codespace list --json name,state --jq --arg name "${CODESPACE_NAME}" '.[] | select(.name==$name) | .state' || true)
            if [ "${state}" = "Available" ]; then
              echo "${CODESPACE_NAME} is available"
              exit 0
            fi
            echo "Waiting for codespace ${CODESPACE_NAME} to become available... (${i}/30)"
            sleep 15
          done

          echo "Codespace ${CODESPACE_NAME} did not become available"
          gh codespace list --json name,state || true
          exit 1

      - name: Start noVNC desktop in Codespace
        shell: bash
        run: |
          set -euo pipefail
          gh codespace ssh -c "${CODESPACE_NAME}" -- \
            'docker run -d --rm --name desktop -p 8080:8080 -e TZ=America/Los_Angeles prbinu/novnc-desktop'

      - name: Forward Codespace port to runner
        shell: bash
        run: |
          set -euo pipefail
          gh codespace ports forward 8080:8080 -c "${CODESPACE_NAME}" >/tmp/codespace-ports.log 2>&1 &
          sleep 10

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080 >/dev/null 2>&1; then
              echo "Desktop is reachable on localhost:8080"
              exit 0
            fi
            sleep 5
          done

          echo "noVNC never became reachable"
          cat /tmp/codespace-ports.log || true
          gh codespace logs -c "${CODESPACE_NAME}" || true
          exit 1

      - name: Install Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Start Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          echo "Opening public tunnel to the forwarded Codespace port..."
          nohup cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          sleep 10
          tail -n 50 /tmp/cloudflared.log || true
